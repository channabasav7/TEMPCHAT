<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TempChat - Ephemeral Optical Handshake Encrypted Chat">

  <!-- Content Security Policy allowing unsafe-eval and wasm-unsafe-eval for Flutter Web runtime -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'wasm-unsafe-eval' blob: data:; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' 'unsafe-inline' https: http: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' blob: data: https:; connect-src 'self' https: http: wss: ws: blob: data:; worker-src 'self' blob:;">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TempChat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TempChat</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // TempChat Cross-Tab Optical Relay & Notification Bridge
    window.tempChatBridge = {
      channel: (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('tempchat_optical_relay') : null,
      listeners: [],
      sendWire: function(msg) {
        if (this.channel) {
          try { this.channel.postMessage(msg); } catch (e) {}
        }
        try {
          localStorage.setItem('tempchat_wire_ping', JSON.stringify({t: Date.now(), d: msg}));
        } catch (e) {}
      },
      listenWire: function(callback) {
        this.listeners.push(callback);
      },
      requestNotificationPermission: function() {
        if ('Notification' in window) {
          return Notification.requestPermission();
        }
        return Promise.resolve('denied');
      },
      showNotification: function(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification(title, {
              body: body,
              icon: 'icons/Icon-192.png',
              badge: 'icons/Icon-192.png',
              silent: false
            });
          } catch (e) {}
        }
      },
      playSound: function(type) {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          if (type === 'send') {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.18, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
          } else {
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1174.66, ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.22, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
            osc.start();
            osc.stop(ctx.currentTime + 0.18);
          }
        } catch (e) {}
      }
    };

    if (window.tempChatBridge.channel) {
      window.tempChatBridge.channel.onmessage = function(ev) {
        window.tempChatBridge.listeners.forEach(function(fn) {
          try { fn(ev.data); } catch (err) {}
        });
      };
    }

    window.addEventListener('storage', function(ev) {
      if (ev.key === 'tempchat_wire_ping' && ev.newValue) {
        try {
          var item = JSON.parse(ev.newValue);
          if (item && item.d) {
            window.tempChatBridge.listeners.forEach(function(fn) {
              try { fn(item.d); } catch (err) {}
            });
          }
        } catch (err) {}
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
